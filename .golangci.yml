version: "2"

linters:
  enable:
    - depguard
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        no-charm-v1:
          desc: Use the Bubble Tea v2 modules under charm.land/*/v2.
          deny:
            - pkg: github.com/charmbracelet/bubbletea$
              desc: use charm.land/bubbletea/v2
            - pkg: github.com/charmbracelet/bubbles$
              desc: use charm.land/bubbles/v2
            - pkg: github.com/charmbracelet/lipgloss$
              desc: use charm.land/lipgloss/v2
            - pkg: github.com/charmbracelet/glamour$
              desc: use charm.land/glamour/v2
            - pkg: charm.land/bubbletea$
              desc: use charm.land/bubbletea/v2
            - pkg: charm.land/bubbles$
              desc: use charm.land/bubbles/v2
            - pkg: charm.land/lipgloss$
              desc: use charm.land/lipgloss/v2
        system-only:
          desc: Only internal/system may run commands or use the network.
          files:
            - $all
            - "!**/internal/system/**"
          deny:
            - pkg: os/exec
              desc: go through system.Runner
            - pkg: net/http
              desc: go through system.Fetcher
            - pkg: net$
              desc: go through system.Fetcher
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/leNITHISH/cronen
